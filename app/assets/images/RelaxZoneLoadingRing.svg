<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- 圓形文字路徑 (半徑 212) -->
    <path id="textPath1" d="M 250, 250 m -212, 0 a 212,212 0 1,1 424,0 a 212,212 0 1,1 -424,0" fill="none" />
    
    <!-- 金色流光漸層 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- 翡翠光彩漸層 -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 外層虛線魔法圈 -->
  <circle cx="250" cy="250" r="242" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="12 8" opacity="0.85" filter="url(#glow)" />
  <circle cx="250" cy="250" r="234" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6" />

  <!-- 內層護甲裝飾圈 -->
  <circle cx="250" cy="250" r="186" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.9" filter="url(#glow)" />
  <circle cx="250" cy="250" r="180" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="6 6" opacity="0.7" />

  <!-- 4 個主要方位寶石菱形裝飾點 -->
  <g fill="#fbbf24" filter="url(#glow)">
    <!-- 上 -->
    <polygon points="250,5 255,16 250,22 245,16" />
    <!-- 下 -->
    <polygon points="250,495 255,484 250,478 245,484" />
    <!-- 左 -->
    <polygon points="5,250 16,255 22,250 16,245" />
    <!-- 右 -->
    <polygon points="495,250 484,255 478,250 484,245" />
  </g>

  <!-- 環形旋轉文字 -->
  <text fill="#ffffff" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="900" font-size="21.5" letter-spacing="5" filter="url(#glow)">
    <textPath href="#textPath1" startOffset="50%" text-anchor="middle">
      ✦ RELAX ZONE ✦ 悠然之境 ✦ RELAX ZONE ✦ 悠然之境 ✦
    </textPath>
  </text>
</svg>
